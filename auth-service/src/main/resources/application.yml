spring:
  application:
    name: auth-service

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

pockethive:
  auth-service:
    provider: ${POCKETHIVE_AUTH_SERVICE_PROVIDER:DEV}
    session-ttl: ${POCKETHIVE_AUTH_SERVICE_SESSION_TTL:PT8H}
    oauth:
      issuer: ${POCKETHIVE_AUTH_OAUTH_ISSUER:http://localhost:8080/auth-service}
      resource: ${POCKETHIVE_AUTH_OAUTH_RESOURCE:http://localhost:8080/mcp}
      authorization-code-ttl: ${POCKETHIVE_AUTH_OAUTH_CODE_TTL:PT2M}
      access-token-ttl: ${POCKETHIVE_AUTH_OAUTH_ACCESS_TOKEN_TTL:PT15M}
      vscode-client-id: pockethive-vscode
      vscode-redirect-uri: ${POCKETHIVE_AUTH_OAUTH_VSCODE_REDIRECT_URI:http://127.0.0.1:57548/callback}
      introspection-client-id: pockethive-mcp
      introspection-client-secret: ${POCKETHIVE_AUTH_OAUTH_INTROSPECTION_SECRET:pockethive-mcp-local-introspection-secret}
    users:
      - id: 11111111-1111-1111-1111-111111111111
        username: local-admin
        display-name: Local Admin
        active: true
        grants:
          - product: AUTH_SERVICE
            permission: ADMIN
            resourceType: AUTH_GLOBAL
            resourceSelector: "*"
          - product: POCKETHIVE
            permission: ALL
            resourceType: PH_DEPLOYMENT
            resourceSelector: "*"
      - id: 22222222-2222-2222-2222-222222222222
        username: local-runner
        display-name: Local Runner
        active: true
        grants:
          - product: POCKETHIVE
            permission: VIEW
            resourceType: PH_DEPLOYMENT
            resourceSelector: "*"
          - product: POCKETHIVE
            permission: RUN
            resourceType: PH_FOLDER
            resourceSelector: demo
      - id: 55555555-5555-5555-5555-555555555555
        username: local-e2e-runner
        display-name: Local E2E Runner
        active: true
        grants:
          - product: POCKETHIVE
            permission: VIEW
            resourceType: PH_DEPLOYMENT
            resourceSelector: "*"
          - product: POCKETHIVE
            permission: RUN
            resourceType: PH_FOLDER
            resourceSelector: e2e
      - id: 33333333-3333-3333-3333-333333333333
        username: local-viewer
        display-name: Local Viewer
        active: true
        grants:
          - product: POCKETHIVE
            permission: VIEW
            resourceType: PH_DEPLOYMENT
            resourceSelector: "*"
    service-accounts:
      - id: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
        service-name: orchestrator-service
        display-name: Orchestrator Service
        secret: ${POCKETHIVE_AUTH_SERVICE_ACCOUNT_ORCHESTRATOR_SECRET:orchestrator-local-secret}
        active: true
        grants:
          - product: POCKETHIVE
            permission: ALL
            resourceType: PH_DEPLOYMENT
            resourceSelector: "*"
      - id: bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb
        service-name: network-proxy-manager
        display-name: Network Proxy Manager
        secret: ${POCKETHIVE_AUTH_SERVICE_ACCOUNT_NETWORK_PROXY_MANAGER_SECRET:network-proxy-manager-local-secret}
        active: true
        grants:
          - product: POCKETHIVE
            permission: ALL
            resourceType: PH_DEPLOYMENT
            resourceSelector: "*"
      - id: cccccccc-cccc-cccc-cccc-cccccccccccc
        service-name: pockethive-mcp
        display-name: PocketHive MCP
        secret: ${POCKETHIVE_AUTH_SERVICE_ACCOUNT_MCP_SECRET:pockethive-mcp-local-service-secret}
        active: true
        grants:
          - product: POCKETHIVE
            permission: ALL
            resourceType: PH_DEPLOYMENT
            resourceSelector: "*"
