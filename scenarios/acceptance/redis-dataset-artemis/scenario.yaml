protocolVersion: 2.0.0
id: acceptance-redis-dataset-artemis
name: Acceptance Redis dataset (artemis)
description: Two isolated Redis sources through Request Builder and HTTP Processor.
template:
  image: swarm-controller:latest
  bees:
  - role: generator
    image: generator:latest
    config:
      enabled: false
      historyPolicy: FULL
      inputs:
        type: REDIS_DATASET
        redis:
          host: redis
          port: 6379
          ssl: false
          sources:
          - listName: acceptance-replaced-first
            weight: 1
          - listName: acceptance-replaced-second
            weight: 1
          pickStrategy: ROUND_ROBIN
          ratePerSec: 2
          initialDelayMs: 0
          tickIntervalMs: 100
      outputs:
        type: ARTEMIS
        artemis:
          persistent: true
      message:
        bodyType: SIMPLE
        body: '{{ payload }}'
        headers:
          x-ph-call-id: acceptance-dataset
    work:
      out:
        out: seeds
    ports:
    - id: out
      direction: out
  - role: request-builder
    image: request-builder:latest
    config:
      enabled: false
      historyPolicy: FULL
      inputs:
        type: ARTEMIS
        artemis:
          consumerWindowBytes: 0
      outputs:
        type: ARTEMIS
        artemis:
          persistent: true
      templateRoot: /app/scenario/templates/http
      serviceId: default
      passThroughOnMissingTemplate: false
    work:
      in:
        in: seeds
      out:
        out: requests
    ports:
    - id: in
      direction: in
    - id: out
      direction: out
  - role: processor
    image: processor:latest
    config:
      enabled: false
      historyPolicy: FULL
      baseUrl: '{{ sut.endpoints[''default''].baseUrl }}'
      mode: THREAD_COUNT
      threadCount: 1
      inputs:
        type: ARTEMIS
        artemis:
          consumerWindowBytes: 0
      outputs:
        type: ARTEMIS
        artemis:
          persistent: true
    work:
      in:
        in: requests
      out:
        out: responses
    ports:
    - id: in
      direction: in
    - id: out
      direction: out
  - role: postprocessor
    image: postprocessor:latest
    config:
      enabled: false
      historyPolicy: FULL
      inputs:
        type: ARTEMIS
        artemis:
          consumerWindowBytes: 0
      outputs:
        type: NONE
      forwardToOutput: false
      txOutcomeSinkMode: NONE
      dropTxOutcomeWithoutCallId: true
    work:
      in:
        in: responses
    ports:
    - id: in
      direction: in
topology:
  version: 1
  edges:
  - id: dataset-build
    from:
      role: generator
      port: out
    to:
      role: request-builder
      port: in
  - id: request-processing
    from:
      role: request-builder
      port: out
    to:
      role: processor
      port: in
  - id: response-consumption
    from:
      role: processor
      port: out
    to:
      role: postprocessor
      port: in
