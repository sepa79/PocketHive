name: Intake skill

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/pockethive-intake/**'
      - 'tools/intake-contracts/**'
      - 'common/**'
      - 'docs/spec/swarm-lifecycle.schema.json'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - '.github/workflows/intake-skill.yml'
  pull_request:
    paths:
      - '.agents/skills/pockethive-intake/**'
      - 'tools/intake-contracts/**'
      - 'common/**'
      - 'docs/spec/swarm-lifecycle.schema.json'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - '.github/workflows/intake-skill.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intake-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    # Full CLI qualification took 19m32s on the hosted runner; leave room for
    # dependency setup, package verification and artifact publication.
    timeout-minutes: 45
    env:
      INTAKE_ARCHIVE: pockethive-intake.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify committed package integrity
        run: python3 -B -I -S .agents/skills/pockethive-intake/scripts/intake.py verify-package

      - name: Check generated runtime vocabulary
        run: tools/intake-contracts/generate.sh --check

      - name: Run public CLI qualification
        run: python3 -B -I -S -m unittest discover -s .agents/skills/pockethive-intake/tests -p 'test_*.py' -v

      - name: Build verified ZIP and checksum
        working-directory: ${{ runner.temp }}
        run: |
          python3 -B -I -S "$GITHUB_WORKSPACE/.agents/skills/pockethive-intake/scripts/package.py" --output "$INTAKE_ARCHIVE"
          sha256sum "$INTAKE_ARCHIVE" > "$INTAKE_ARCHIVE.sha256"

      - name: Upload portable skill
        uses: actions/upload-artifact@v4
        with:
          name: pockethive-intake-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ env.INTAKE_ARCHIVE }}
            ${{ runner.temp }}/${{ env.INTAKE_ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
