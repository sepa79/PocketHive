name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check HiveForge action-root contract
        run: bash tools/hiveforge-contract-check.sh

      - name: Run Maven tests
        run: mvn -B -ntp test

  scoped-java-mutation:
    name: MCP and Auth mutation gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install reactor dependencies
        run: mvn -B -ntp -DskipTests install

      - name: Run PocketHive MCP mutation gate
        run: mvn -B -ntp -f pockethive-mcp-service/pom.xml org.pitest:pitest-maven:mutationCoverage

      - name: Run Auth Service mutation gate
        run: mvn -B -ntp -f auth-service/pom.xml org.pitest:pitest-maven:mutationCoverage

  vscode-extension:
    name: VS Code extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: vscode-pockethive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-pockethive/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run extension tests
        run: npm test

      - name: Check VSIX contents
        run: npm run package:check

      - name: Set up Node 22 for Stryker
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-pockethive/package-lock.json

      - name: Run mutation gate
        if: runner.os == 'Linux'
        run: npm run mutation
