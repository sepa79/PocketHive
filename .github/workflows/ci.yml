name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check HiveForge action-root contract
        run: bash tools/hiveforge-contract-check.sh

      - name: Run Maven tests
        run: tools/test/with-infrastructure.sh ./mvnw -B -ntp test

  scoped-java-mutation:
    name: MCP, Auth and HTTP Sequence mutation gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install reactor dependencies
        run: ./mvnw -B -ntp -DskipTests install

      - name: Run PocketHive MCP mutation gate
        run: tools/test/with-infrastructure.sh ./mvnw -B -ntp -f pockethive-mcp-service/pom.xml org.pitest:pitest-maven:mutationCoverage

      - name: Run Auth Service mutation gate
        run: tools/test/with-infrastructure.sh ./mvnw -B -ntp -f auth-service/pom.xml org.pitest:pitest-maven:mutationCoverage

      - name: Run HTTP Sequence mutation gate
        run: tools/test/with-infrastructure.sh ./mvnw -B -ntp -f http-sequence-service/pom.xml -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage

  vscode-extension:
    name: VS Code extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: vscode-pockethive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-pockethive/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run extension tests
        run: npm test

      - name: Check VSIX contents
        run: npm run package:check

      - name: Set up minimum supported VS Code runtime
        uses: actions/setup-node@v4
        with:
          node-version: '18.15.0'

      - name: Check endpoint discovery on minimum runtime
        run: node --test out/test/endpointValidator.test.js out/test/endpointSecurityPolicy.test.js
