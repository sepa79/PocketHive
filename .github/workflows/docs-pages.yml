name: Publish Docs Site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "tools/docs-validation/**"
      - "tools/docs-impact/**"
      - "tools/pockethive-mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json
            tools/pockethive-mcp/package-lock.json

      - name: Generate explicit validation adapter manifest
        id: validation_adapters
        shell: bash
        env:
          ADAPTER_MANIFEST_PATH: ${{ runner.temp }}/pockethive-docs-validation-adapters.json
        run: |
          set -euo pipefail
          NODE_EXECUTABLE="$(node --print 'process.execPath')"
          NPM_EXECUTABLE="$(dirname "$NODE_EXECUTABLE")/npm"
          "$NODE_EXECUTABLE" tools/docs-validation/generate-adapter-manifest.mjs \
            --output "$ADAPTER_MANIFEST_PATH" \
            --platform linux \
            --node "$NODE_EXECUTABLE" \
            --git /usr/bin/git \
            --npm "$NPM_EXECUTABLE" \
            --command-shell /usr/bin/bash \
            --taskkill NOT_APPLICABLE \
            --bash /usr/bin/bash \
            --power-shell /usr/bin/pwsh \
            --java NOT_APPLICABLE \
            --maven NOT_APPLICABLE \
            --local-repository NOT_APPLICABLE \
            --docker NOT_APPLICABLE \
            --chromium /usr/bin/google-chrome
          ADAPTER_MANIFEST_CANONICAL="$(realpath "$ADAPTER_MANIFEST_PATH")"
          echo "manifest=$ADAPTER_MANIFEST_CANONICAL" >> "$GITHUB_OUTPUT"
          echo "node=$NODE_EXECUTABLE" >> "$GITHUB_OUTPUT"

      - name: Install validation dependencies
        run: |
          npm ci
          npm ci --prefix docs-site
          npm ci --prefix tools/pockethive-mcp

      - name: Build and verify documentation through the static controller
        shell: bash
        run: |
          "${{ steps.validation_adapters.outputs.node }}" tools/docs-validation/run.mjs \
            --profile static \
            --repo "$GITHUB_WORKSPACE" \
            --report "$RUNNER_TEMP/pockethive-docs-validation-static.json" \
            --candidate-mode COMMITTED_GIT \
            --adapter-manifest "${{ steps.validation_adapters.outputs.manifest }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
