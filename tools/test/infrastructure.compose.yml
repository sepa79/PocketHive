services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2 -rabbit loopback_users []'
    ports:
      - "127.0.0.1::5672"
      - "127.0.0.1::15672"
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 2s
      timeout: 5s
      retries: 60
