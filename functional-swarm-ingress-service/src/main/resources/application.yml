spring:
  application:
    name: functional-swarm-ingress-service
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST}

pockethive:
  inputs:
    type: ${POCKETHIVE_INPUTS_TYPE}
    redis:
      host: ${POCKETHIVE_INPUTS_REDIS_HOST}
      port: ${POCKETHIVE_INPUTS_REDIS_PORT}
      ssl: ${POCKETHIVE_INPUTS_REDIS_SSL}
      listName: ${POCKETHIVE_INPUTS_REDIS_LISTNAME}
      pickStrategy: ${POCKETHIVE_INPUTS_REDIS_PICKSTRATEGY}
      ratePerSec: ${POCKETHIVE_INPUTS_REDIS_RATEPERSEC}
      initialDelayMs: ${POCKETHIVE_INPUTS_REDIS_INITIALDELAYMS}
      tickIntervalMs: ${POCKETHIVE_INPUTS_REDIS_TICKINTERVALMS}
  outputs:
    type: RABBITMQ
    rabbit:
      exchange: ${POCKETHIVE_OUTPUT_RABBIT_EXCHANGE}
      routingKey: ${POCKETHIVE_OUTPUT_RABBIT_ROUTING_KEY}
  control-plane:
    exchange: ${POCKETHIVE_CONTROL_PLANE_EXCHANGE}
    swarm-id: ${POCKETHIVE_CONTROL_PLANE_SWARM_ID}
    instance-id: ${POCKETHIVE_CONTROL_PLANE_INSTANCE_ID}
    control-queue-prefix: ${POCKETHIVE_CONTROL_PLANE_CONTROL_QUEUE_PREFIX}
    worker:
      role: ${POCKETHIVE_CONTROL_PLANE_WORKER_ROLE}
      skip-self-signals: false
