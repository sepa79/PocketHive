---
# Shared deployment input for deploy/update; services receive projections of these values.
pockethive_allow_remote_http: "{{ lookup('env', 'POCKETHIVE_ALLOW_REMOTE_HTTP') }}"
pockethive_public_ingress: "{{ lookup('env', 'POCKETHIVE_PUBLIC_INGRESS') }}"
pockethive_public_host: "{{ lookup('env', 'POCKETHIVE_PUBLIC_HOST') }}"
pockethive_mcp_introspection_secret: "{{ lookup('env', 'POCKETHIVE_AUTH_OAUTH_INTROSPECTION_SECRET') }}"
pockethive_mcp_service_secret: "{{ lookup('env', 'POCKETHIVE_AUTH_SERVICE_ACCOUNT_MCP_SECRET') }}"
