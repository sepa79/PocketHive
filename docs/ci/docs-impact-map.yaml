      - wiremock/README.md
      - wiremock/__files/**
      - wiremock/mappings/**
    checkIds: [deployment-posix-package-contract]
    ownerIds: [deployment-maintainers]
  - id: deployment-archive-windows
    kind: PACKAGE
    locatorKind: ARCHIVE_ENTRY
    contentRoot: pockethive
    artifactSelector: pockethive-deployment-*.zip
    producerPaths: [package-deployment.bat, pom.xml]
    contentInputPaths:
      - .env.example
      - LICENSE
      - README.md
      - docker-compose.yml
      - docs/GHCR_SETUP.md
      - docs/HIVEFORGE.md
      - docs/USAGE.md
