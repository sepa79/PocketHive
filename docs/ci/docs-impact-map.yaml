# Governance overlays are independent of documentation obligations. CONTROL
# protects the trusted classifier base; PROTECTED marks contracts and sensitive
# integration/deployment surfaces for explicit owner review.
protectionRules:
  - id: documentation-automation-control
    kind: CONTROL
    paths:
      - docs/ci/docs-impact-map.schema.json
      - docs/ci/docs-impact-map.yaml
      - package-lock.json
      - package.json
      - tools/docs-impact/**
    ownerIds: [repository-maintainers, architecture-maintainers]

  - id: repository-governance-control
    kind: CONTROL
    paths:
      - .github/CODEOWNERS
      - .github/pull_request_template.md
      - .github/workflows/**
      - AGENTS.md
      - CONTRIBUTING.md
    ownerIds: [repository-maintainers]

  - id: architecture-contracts-protected
    kind: PROTECTED
    paths:
      - docs/ARCHITECTURE.md
      - docs/ORCHESTRATOR-REST.md
      - docs/architecture/**
      - docs/correlation-vs-idempotency.md
      - docs/observability.md
      - docs/scenarios/**
      - docs/spec/**
    ownerIds: [architecture-maintainers]

  - id: control-plane-contracts-protected
    kind: PROTECTED
    paths:
      - common/control-plane-core/**
      - common/control-plane-filesystem/**
      - common/control-plane-spring/**
      - common/manager-sdk/**
      - common/topology-core/**
      - common/worker-sdk/**
      - packages/swarm-lifecycle-contract/**
    ownerIds: [architecture-maintainers, platform-maintainers, worker-maintainers]

  - id: authentication-contracts-protected
    kind: PROTECTED
    paths:
      - auth-service/**
      - common/auth-client/**
      - common/auth-contracts/**
      - docs/architecture/AUTH_SERVICE_API_SPEC.md
    ownerIds: [security-maintainers]

  - id: client-integration-protected
