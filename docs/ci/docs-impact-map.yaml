schemaVersion: 2
repositoryId: sepa79/PocketHive
platformProfile: GITHUB_STRICT_HEAD
mode: SHADOW

# The classifier, schemas, canonical values, and dependency manifests are read
# only from the protected base. Candidate copies are data, never authority.
trustedToolPaths:
  - docs/ci/docs-impact-map.schema.json
  - package-lock.json
  - package.json
  - tools/docs-impact/**

# Stable roles are separate from their current GitHub identity resolution.
# They all resolve to the sole current CODEOWNER, so this registry does not
# prove reviewer independence and cannot support required enforcement.
owners:
  - id: repository-maintainers
    githubPrincipals: ["@sepa79"]
  - id: architecture-maintainers
    githubPrincipals: ["@sepa79"]
  - id: documentation-maintainers
    githubPrincipals: ["@sepa79"]
  - id: platform-maintainers
    githubPrincipals: ["@sepa79"]
  - id: worker-maintainers
    githubPrincipals: ["@sepa79"]
  - id: ui-maintainers
    githubPrincipals: ["@sepa79"]
  - id: integration-maintainers
    githubPrincipals: ["@sepa79"]
  - id: deployment-maintainers
    githubPrincipals: ["@sepa79"]
  - id: security-maintainers
    githubPrincipals: ["@sepa79"]

# PLANNED checks are labels for later isolated validation. They cannot satisfy
# an obligation or contribute to readiness in AD-01.
checks:
  - id: auth-contract
    stageId: auth-contract
    availability: PLANNED
  - id: control-plane-contract
    stageId: control-plane-contract
    availability: PLANNED
  - id: deployment-contract
    stageId: deployment-contract
    availability: PLANNED
  - id: docs-site-contract
    stageId: docs-site-contract
    availability: PLANNED
  - id: lifecycle-contract
    stageId: lifecycle-contract
    availability: PLANNED
  - id: mcp-contract
    stageId: mcp-contract
    availability: PLANNED
  - id: observability-contract
    stageId: observability-contract
    availability: PLANNED
  - id: scenario-contract
    stageId: scenario-contract
    availability: PLANNED
  - id: worker-contract
    stageId: worker-contract
    availability: PLANNED
  - id: repository-document-contract
    stageId: repository-document-contract
    availability: PLANNED
  - id: deployment-posix-package-contract
    stageId: deployment-posix-package-contract
    availability: PLANNED
  - id: deployment-windows-package-contract
    stageId: deployment-windows-package-contract
    availability: PLANNED
  - id: mcp-package-contract
    stageId: mcp-package-contract
    availability: PLANNED
  - id: vscode-package-contract
    stageId: vscode-package-contract
    availability: PLANNED
  - id: tcp-mock-jar-docs-contract
    stageId: tcp-mock-jar-docs-contract
    availability: PLANNED
  - id: tcp-mock-image-docs-contract
    stageId: tcp-mock-image-docs-contract
    availability: PLANNED
  - id: ui-image-docs-contract
    stageId: ui-image-docs-contract
    availability: PLANNED

# Publication identities distinguish independently verifiable destinations.
# Bindings below name the exact route or artifact-relative path per document.
publications:
  - id: repository
    kind: REPOSITORY
    locatorKind: REPOSITORY_PATH
    contentRoot: /
    artifactSelector: "git-tree:{headSha}"
    producerPaths: []
    contentInputPaths:
      - .amazonq/ai/**
      - .amazonq/rules/**
      - .github/pull_request_template.md
      - AGENTS.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - DEPLOYMENT_PACKAGE.md
      - docs/**
      - docs-site/README.md
      - README.md
      - scenarios/bundles/db-query-postgres-smoke/test-postgres/README.md
      - scenarios/bundles/http-sequence-six-auth-flow/CHANGELOG.md
      - scenarios/bundles/http-sequence-six-auth-flow/FLOW_DOCUMENT.md
      - scenarios/bundles/http-sequence-six-auth-flow/README.md
      - scenarios/bundles/http-sequence-six-auth-wizard-proof/CHANGELOG.md
      - scenarios/bundles/http-sequence-six-auth-wizard-proof/FLOW_DOCUMENT.md
      - scenarios/bundles/http-sequence-six-auth-wizard-proof/README.md
      - scenarios/bundles/webauth-balance-redis/README.md
      - scenarios/bundles/webauth-loop-redis-minimal/README.md
      - scenarios/bundles/webauth-redemption-redis/README.md
      - scenarios/bundles/webauth-topup-redis/README.md
      - scenarios/e2e/webauth-loop-redis-5-customers/README.md
      - tcp-mock-server/README.md
      - tcp-mock-server/docs/**
      - tools/pockethive-mcp/CHANGELOG.md
      - tools/pockethive-mcp/fixtures/scenario-regression/README.md
      - tools/pockethive-mcp/README.md
      - vscode-pockethive/README.md
      - wiremock/README.md
    checkIds: [repository-document-contract]
    ownerIds: [repository-maintainers]
  - id: docs-site
    kind: DOCS_SITE
    locatorKind: DOCUSAURUS_ROUTE
    contentRoot: /
    artifactSelector: docs-site/build
    producerPaths:
      - .github/workflows/docs-pages.yml
      - docs-site/docusaurus.config.ts
      - docs-site/package-lock.json
      - docs-site/package.json
      - docs-site/scripts/**
      - docs-site/sidebars.ts
      - docs-site/tsconfig.json
    contentInputPaths:
      - docs-site/src/**
      - docs-site/static/**
      - docs/guides/**
      - docs/architecture/**
      - docs/scenarios/**
      - docs/sdk/**
      - docs/control-plane/worker-guide.md
