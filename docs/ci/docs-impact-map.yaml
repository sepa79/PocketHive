    artifactSelector: tools/pockethive-mcp/pockethive-mcp-server-*.tgz
    producerPaths:
      - scenario-manager-service/capabilities/**
      - scripts/generate-scenario-config-defaults.mjs
      - tools/pockethive-mcp/package.json
    contentInputPaths:
