# Rules are additive. SELF makes each material node independently explainable;
# DIRECT and TRANSITIVE consume only explicit CONTINUE/STOP routes above. A
# changed source file is intentionally excluded as satisfaction evidence.
documentationRules:
  - id: system-contract-projections
    impactNodeIds: [contract-system-architecture]
    impactDepths: [SELF, DIRECT, TRANSITIVE]
    sourceChangeKinds: [ADD, MODIFY, DELETE, TYPE_CHANGE]
    targets:
      - documentId: system-workflows
        acceptedChangeKinds: [MODIFY]
      - documentId: project-map
        acceptedChangeKinds: [MODIFY]
      - documentId: repository-readme
        acceptedChangeKinds: [MODIFY]
    checkIds: [docs-site-contract, repository-document-contract, deployment-posix-package-contract, deployment-windows-package-contract]
    ownerIds: [architecture-maintainers, platform-maintainers, documentation-maintainers, repository-maintainers, deployment-maintainers]

