      - docs/UPGRADING.md
      - docs/observability.md
      - docs/correlation-vs-idempotency.md
    checkIds: [docs-site-contract]
    ownerIds: [documentation-maintainers]
  - id: deployment-archive-posix
    kind: PACKAGE
    locatorKind: ARCHIVE_ENTRY
    contentRoot: pockethive
    artifactSelector: pockethive-deployment-*.tar.gz
    producerPaths: [package-deployment.sh, pom.xml]
    contentInputPaths:
      - .env.example
      - LICENSE
      - README.md
      - docker-compose.yml
      - docs/GHCR_SETUP.md
      - docs/USAGE.md
      - grafana/**
      - rabbitmq/**
      - scenario-manager-service/capabilities/**
      - scenario-manager-service/network/network-profiles.yaml
      - scenario-manager-service/sut/sut-environments.yaml
