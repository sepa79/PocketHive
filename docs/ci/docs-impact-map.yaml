      - tools/pockethive-mcp/workflow-agentic-evals.mjs
      - tools/pockethive-mcp/workflow-tools.mjs
    checkIds: [mcp-package-contract]
    ownerIds: [integration-maintainers]
  - id: pockethive-vscode-vsix
    kind: PACKAGE
    locatorKind: VSIX_EXTENSION_PATH
    contentRoot: extension
    artifactSelector: vscode-pockethive/pockethive-vscode-*.vsix
    producerPaths:
      - docs/spec/swarm-lifecycle.schema.json
      - scripts/generate-swarm-lifecycle-contract.mjs
      - vscode-pockethive/.vscodeignore
      - vscode-pockethive/package.json
    contentInputPaths:
      - vscode-pockethive/LICENSE
      - vscode-pockethive/README.md
      - vscode-pockethive/init.sh
