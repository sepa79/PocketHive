# Edges are documentation-impact direction, not a reconstruction of runtime
# calls. Every edge explicitly decides all four source change kinds. STOP adds
# the destination impact and ends that route; CONTINUE permits another declared
# hop. One ordered node pair has exactly one edge.
impactEdges:
  - id: system-architecture-to-control-contract
    fromNodeId: contract-system-architecture
    toNodeId: contract-control-plane
    relation: CONTRACT_PROJECTION
    decisions:
      - changeKinds: [ADD, MODIFY, DELETE, TYPE_CHANGE]
        propagation: CONTINUE
  - id: system-architecture-to-lifecycle-contract
    fromNodeId: contract-system-architecture
    toNodeId: contract-lifecycle
    relation: CONTRACT_PROJECTION
    decisions:
      - changeKinds: [ADD, MODIFY, DELETE, TYPE_CHANGE]
        propagation: CONTINUE
  - id: system-architecture-to-scenario-contract
    fromNodeId: contract-system-architecture
    toNodeId: contract-scenario
    relation: CONTRACT_PROJECTION
    decisions:
      - changeKinds: [ADD, MODIFY, DELETE, TYPE_CHANGE]
        propagation: CONTINUE
  - id: system-architecture-to-auth-contract
    fromNodeId: contract-system-architecture
    toNodeId: contract-auth
    relation: CONTRACT_PROJECTION
    decisions:
      - changeKinds: [ADD, MODIFY, DELETE, TYPE_CHANGE]
        propagation: CONTINUE
  - id: system-architecture-to-orchestrator-rest
    fromNodeId: contract-system-architecture
    toNodeId: contract-orchestrator-rest
    relation: CONTRACT_PROJECTION
    decisions:
      - changeKinds: [ADD, MODIFY, DELETE, TYPE_CHANGE]
        propagation: CONTINUE
  - id: system-architecture-to-observability-contract
    fromNodeId: contract-system-architecture
    toNodeId: contract-observability
    relation: CONTRACT_PROJECTION
    decisions:
      - changeKinds: [ADD, MODIFY, DELETE, TYPE_CHANGE]
        propagation: CONTINUE
  - id: documentation-impact-contract-to-tool
    fromNodeId: contract-documentation-impact
    toNodeId: tool-documentation-automation
    relation: CONTRACT_PROJECTION
    decisions:
      - changeKinds: [ADD, MODIFY, DELETE, TYPE_CHANGE]
        propagation: STOP
  - id: completed-work-review-contract-to-tool
    fromNodeId: contract-completed-work-review
    toNodeId: tool-completed-work-review
    relation: CONTRACT_PROJECTION
    decisions:
      - changeKinds: [ADD, MODIFY, DELETE, TYPE_CHANGE]
        propagation: STOP

  - id: control-contract-to-core
    fromNodeId: contract-control-plane
    toNodeId: shared-control-core
    relation: CONTRACT_PROJECTION
    decisions:
      - changeKinds: [ADD, MODIFY, DELETE, TYPE_CHANGE]
        propagation: CONTINUE
  - id: control-contract-to-filesystem
    fromNodeId: contract-control-plane
